<div class="page" id="pg-qa">
  <p class="page-label">Ask Anything</p>
  <h2 class="page-title">Q&amp;A <em>Corner</em></h2>
  <div class="divider"></div>
  <div class="qa-wrap">
    <div class="qa-list" id="qaList"></div>
    <div class="qa-new card" style="margin-top:1rem;">
      <h4>&#x270F;&#xFE0F; &nbsp; Ask Habeeb Anything</h4>
      <textarea class="qa-input" id="qaQuestion" placeholder="Your question..." rows="2"></textarea>
      <button class="btn btn-primary" onclick="submitQuestion()" style="font-size:.8rem;padding:.6rem 1.5rem;">Send Question &#x1F4AC;</button>
    </div>
  </div>
  <div style="margin-top:1.2rem;display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;">
    <button class="btn btn-ghost" onclick="showPage('pg-mood')" style="font-size:.75rem;padding:.6rem 1.2rem;">&#x2190; Garden</button>
    <button class="btn btn-ghost" onclick="showPage('pg-dq')" style="font-size:.75rem;padding:.6rem 1.2rem;">Next: Question &#x2192;</button>
  </div>
</div>
