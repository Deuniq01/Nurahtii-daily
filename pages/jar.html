<div class="page" id="pg-jar">
  <p class="page-label">A Gift Waiting</p>
  <h2 class="page-title">The <em>Love Jar</em></h2>
  <div class="divider"></div>
  <div class="jar-wrap">
    <p class="jar-count" id="jarCount">0 / 100 surprises collected</p>
    <div class="jar-stars" id="jarStars"></div>
    <!-- SVG Jar -->
    <svg class="jar-svg" id="jarSvg" onclick="openJar()" viewBox="0 0 180 220" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="jarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#f4a7c3;stop-opacity:0.3"/>
          <stop offset="100%" style="stop-color:#7ab3d4;stop-opacity:0.3"/>
        </linearGradient>
        <linearGradient id="lidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#d4a843"/>
          <stop offset="100%" style="stop-color:#b8860b"/>
        </linearGradient>
      </defs>
      <!-- Lid -->
      <rect x="40" y="15" width="100" height="25" rx="8" fill="url(#lidGrad)" opacity="0.9"/>
      <rect x="50" y="10" width="80" height="12" rx="5" fill="#d4a843" opacity="0.7"/>
      <!-- Jar body -->
      <path d="M30 40 Q25 50 22 80 L18 160 Q16 185 90 190 Q164 185 162 160 L158 80 Q155 50 150 40 Z" fill="url(#jarGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
      <!-- Shine -->
      <path d="M40 55 Q38 100 40 140" stroke="rgba(255,255,255,0.25)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Hearts inside -->
      <text x="90" y="110" text-anchor="middle" font-size="28" opacity="0.6">&#x1F90D;</text>
      <text x="70" y="145" text-anchor="middle" font-size="18" opacity="0.4">&#x1F499;</text>
      <text x="112" y="148" text-anchor="middle" font-size="16" opacity="0.4">&#x2728;</text>
      <!-- Label -->
      <text x="90" y="175" text-anchor="middle" font-family="serif" font-style="italic" font-size="11" fill="rgba(232,221,208,0.6)">Our Love</text>
    </svg>
    <p class="body-text" style="font-size:.85rem;">Tap the jar to open today's surprise</p>
    <div class="jar-surprise" id="jarSurprise">
      <div class="jar-stars" style="margin-bottom:.8rem;">&#x2728;&#x1F90D;&#x2728;</div>
      <div class="jar-surprise-text" id="jarSurpriseText"></div>
    </div>
    <div class="jar-already" id="jarAlready" style="display:none;"></div>
  </div>
  <div style="margin-top:1.2rem;display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;">
    <button class="btn btn-ghost" onclick="showPage('pg-dua')" style="font-size:.75rem;padding:.6rem 1.2rem;">&#x2190; Dua</button>
    <button class="btn btn-ghost" onclick="showPage('pg-countdown')" style="font-size:.75rem;padding:.6rem 1.2rem;">Next: Countdown &#x2192;</button>
  </div>
</div>
